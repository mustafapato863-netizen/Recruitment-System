services:
  api:
    build:
      context: .
      target: api
    env_file: ${RECRUITFLOW_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      RECRUITFLOW_DOCUMENT_STORAGE_PATH: /data/documents
    volumes:
      - documents:/data/documents
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: ${RECRUITFLOW_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  documents:
