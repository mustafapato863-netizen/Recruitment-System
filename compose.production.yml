services:
  api:
    build:
      context: .
      target: api
    # Dokploy writes Environment-tab values to .env. Hostinger can override
    # this with RECRUITFLOW_ENV_FILE=.env.production.
    env_file: ${RECRUITFLOW_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      RECRUITFLOW_DOCUMENT_STORAGE_PATH: /data/documents
    volumes:
      - documents:/data/documents
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    # Keep API and worker configuration identical; both need the outbox key.
    env_file: ${RECRUITFLOW_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  documents:
