packages:
  - "apps/*"
  - "database"
  - "packages/*"

overrides:
  deepmerge-ts: "^8.0.0"
  nanoid: "^3.3.18"
  fast-uri: ">=3.1.6"
  qs: ">=6.16.0"
  "@xmldom/xmldom": ">=0.8.15"
  tmp: ">=0.2.4"
  cross-spawn: ">=7.0.5"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
