packages:
  - "apps/*"
  - "database"
  - "packages/*"

overrides:
  deepmerge-ts: "^8.0.0"
  nanoid: "^3.3.18"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
