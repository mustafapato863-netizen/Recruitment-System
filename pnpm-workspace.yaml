packages:
  - "apps/*"
  - "database"
  - "packages/*"

overrides:
  nodemailer: ">=10.0.9"
  multer: ">=2.3.0"
  deepmerge-ts: "^8.0.0"
  nanoid: "^3.3.18"
  fast-uri: ">=3.1.6"
  qs: ">=6.16.0"
  "@xmldom/xmldom": ">=0.8.15"
  tmp: ">=0.2.4"
  cross-spawn: ">=7.0.5"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# GHSA-hp3w-g68c-fv3c: moderate DoS (unbounded precision specifiers) in sprintf-js 1.0.3,
# pulled in via mammoth -> argparse@1. No fixed sprintf-js is published (latest is 1.1.3).
# Ignore approved by Mustafa on 2026-10-11. Remove once mammoth or sprintf-js ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-hp3w-g68c-fv3c
